name: simulation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/**'
      - 'compose*.yaml'
      - 'config/**'
      - 'locks/**'
      - 'ros_ws/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/simulation.yml'
jobs:
  control-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build simulation image
        run: ./scripts/dev build sim
      - name: Unit tests
        run: ./scripts/dev test
      - name: Three-UAV heartbeat and pose
        run: ./scripts/dev sim --profile control
      - name: Collect status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100 sim
      - name: Stop simulation processes
        if: always()
        run: ./scripts/dev stop --force

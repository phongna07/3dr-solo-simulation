# Default; select with --preset scen5_1000. Unscaled counterpart of upstream scenarios/scen5.yaml; metres, m/s.
# Keep the worker solve/mapping cycle inside simulation-time command expiry.
simulation_real_time_factor: 0.2
flight_altitude: 30.0
# 25 m above flight altitude: rays stay below the top to 50 m range up to 30 deg tilt.
obstacle_height: 55.0
target_height: 0.05
overhead_camera_offset: [-70, -70, 240]
camera_width: 320
camera_height: 320
camera_rate: 8.0
camera_hfov: 1.392432603581188
coverage_ray_diameter: 0.3
coverage_outline_diameter: 0.3
target_startup_ramp_sim: 3.0
lidar_rate: 10.0
lidar_samples: 360
lidar_noise_stddev: 0.016666666666666666
control_period: 0.1
diagnostic_capture_cycles: 128
controller_execution: parallel
controller_worker_timeout_wall: 2.0
controller_worker_startup_timeout_wall: 30.0
publish_rate: 20.0
state_timeout_sim: 0.5
sensor_timeout_sim: 0.5
target_timeout_sim: 1.5
planner_failure_timeout_sim: 3.0
# Metric runs: solver fallbacks stay visible in telemetry without ending the mission.
abort_on_planner_failure: false
# Pause Gazebo during each fleet solve, so solve time adds no simulated latency.
solver_lockstep: true
solver_lockstep_hold_wall: 2.5
arrival_fleet_radius: 65.0
arrival_timeout_sim: 30.0
command_timeout_sim: 0.4
command_timeout_wall: 3.0
pose_timeout_wall: 3.0
flight_timeout_sim: 2.5
flight_timeout_wall: 3.0
altitude_kp: 1.0
vertical_speed_limit: 2.0
frame_history_tolerance: 0.3
params:
  ROBOT_RADIUS: 0.5
  # Match upstream scenarios/scen5.yaml and config.py prediction/formation values.
  UAV_SAFE_DISTANCE: 3.0
  COLLISION_AVOID_DISTANCE: 7.5
  VMAX: 10.0
  UMAX: 5.0
  ACCEL_TAU: 0.2
  GRID_RESOLUTION: 2.0
  INFLATE_MARGIN: 1.0
  CORRIDOR_BOX: 25.0
  LOCAL_PLAN_RADIUS: 150.0
  # Upstream config.py default slot candidates; scen5 does not override them.
  GRID_CELLS: [[0, 1], [-1, 0], [0, -1], [1, 0]]
  CORRIDOR_MARGIN: 1.5
  # Retain measured-state recovery.
  SPEED_RECOVERY: true
  LOCAL_SEARCH: jps
  CONTINGENCY: true
  BACKUP_HORIZON: 25
  W_backup: 0.1
  TERMINAL_STOP: false
  CORRIDOR_MAX_FACES: 16
  CORRIDOR_CACHE_FACES: [4, 5, 6, 7, 8, 9, 10, 11, 12]
  SLOT_MIN_RATIO: 0.3
  SLOT_EXPAND_SPEED: 5.0
  SLOT_LOOKAHEAD_TIME: 5.0
  IPOPT_OPTIONS:
    ipopt.max_iter: 500
    ipopt.max_cpu_time: 0.75
    ipopt.print_level: 0
    ipopt.tol: 0.0001
    ipopt.acceptable_tol: 0.01
    ipopt.acceptable_iter: 15
    print_time: 0
landing_timeout_sim: 120.0

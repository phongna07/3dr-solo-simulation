# Select with --preset scen1. Distances are metres and velocity is metres/second.
# Keep the five-worker solve/mapping cycle inside simulation-time command expiry.
simulation_real_time_factor: 0.2
flight_altitude: 6.0
obstacle_height: 8.0
target_height: 0.05
overhead_camera_offset: [-20, -20, 52]
camera_width: 320
camera_height: 320
camera_rate: 8.0
camera_hfov: 1.392432603581188
coverage_ray_diameter: 0.06
coverage_outline_diameter: 0.06
target_startup_ramp_sim: 3.0
lidar_rate: 10.0
lidar_samples: 360
lidar_noise_stddev: 0.0033333333333333335
control_period: 0.1
diagnostic_capture_cycles: 128
controller_execution: parallel
controller_worker_timeout_wall: 2.0
controller_worker_startup_timeout_wall: 30.0
publish_rate: 20.0
state_timeout_sim: 0.5
sensor_timeout_sim: 0.5
target_timeout_sim: 1.5
planner_failure_timeout_sim: 3.0
arrival_fleet_radius: 13.0
arrival_timeout_sim: 30.0
command_timeout_sim: 0.4
command_timeout_wall: 3.0
pose_timeout_wall: 3.0
flight_timeout_sim: 2.5
flight_timeout_wall: 3.0
altitude_kp: 1.0
vertical_speed_limit: 0.5
frame_history_tolerance: 0.3
params:
  ROBOT_RADIUS: 0.5
  # Scaled scen1 bounds; retain physical Iris radius and at least 1 m separation.
  UAV_SAFE_DISTANCE: 1.0
  COLLISION_AVOID_DISTANCE: 1.5
  VMAX: 2.2
  UMAX: 1.0
  ACCEL_TAU: 0.2
  GRID_RESOLUTION: 0.4
  INFLATE_MARGIN: 0.2
  CORRIDOR_BOX: 5.0
  LOCAL_PLAN_RADIUS: 30.0
  # Retain measured-state recovery and derived grid-cell corridor allowance.
  SPEED_RECOVERY: true
  LOCAL_SEARCH: jps
  CONTINGENCY: true
  BACKUP_HORIZON: 25
  W_backup: 0.1
  TERMINAL_STOP: false
  CORRIDOR_MAX_FACES: 16
  CORRIDOR_CACHE_FACES: [4, 5, 6, 7, 8, 9, 10, 11, 12]
  SLOT_MIN_RATIO: 0.3
  SLOT_EXPAND_SPEED: 1.0
  SLOT_LOOKAHEAD_TIME: 5.0
  IPOPT_OPTIONS:
    ipopt.max_iter: 500
    ipopt.max_cpu_time: 0.75
    ipopt.print_level: 0
    ipopt.tol: 0.0001
    ipopt.acceptable_tol: 0.01
    ipopt.acceptable_iter: 15
    print_time: 0
landing_timeout_sim: 120.0

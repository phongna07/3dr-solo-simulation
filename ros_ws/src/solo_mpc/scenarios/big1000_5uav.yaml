params:
  CBF_BOX_RATIO: 0.5
  TIMESTEP: 0.1            # controller.control_period supplies the runtime value
  HORIZON_LENGTH: 20
  VMAX: 10
  UMAX: 5
  ROBOT_RADIUS: 0.5
  UAV_SAFE_DISTANCE: 2.0   # >= 2 * VMAX * dt; sampled constraints remain soft
  CORRIDOR_BOX: 25
  CORRIDOR_BARRIER_EPS: 1.0
  COST_LENGTH_SCALE: 10
  W_sat_slot: 10
  GRID_CELLS: [[-1, 0], [1, 0], [0, -1], [0, 1]]
  SENSING_RADIUS: 50
  SENSING_NEIGHBOR: 55     # includes both 25 m backup reaches plus separation
  LIDAR_RANGE_MIN: 0.5
  LIDAR_NOISE: 0.05
  GRID_RESOLUTION: 2.0
  INFLATE_MARGIN: 1.0     # total inflation = 0.5 + 1.0 = 1.5 m
  START_SNAP_RADIUS: 20
  GOAL_CLAMP_MARGIN: 10
  LOCAL_SEARCH: jps
  LOCAL_PLAN_RADIUS: 150
  UNKNOWN_POLICY: optimistic
  UNKNOWN_COST: 1.5        # used by Dijkstra fallback; JPS has uniform costs
  TARGET_REPLAN_THRESHOLD: 15
  MAX_COMMIT_AGE: 20
  KF_OBS_NOISE_STD: 1.0
  TAR_RADIUS: 1.0          # 2 m square visible marker in Gazebo
  TAR_SMOOTH_ENABLE: true
  TAR_SPLINE_DS: 2.0

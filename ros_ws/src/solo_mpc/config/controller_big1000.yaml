# Companion settings for scenarios/big1000_5uav.yaml; no small-map overrides.
# Starting values for later flight validation on the simulation machine.
flight_altitude: 30.0
obstacle_height: 40.0
target_height: 0.05
camera_width: 160
camera_height: 160
camera_rate: 8.0
camera_hfov: 1.3894765524  # 2*atan(25/30): 50 m ground footprint at 30 m
lidar_rate: 10.0
lidar_samples: 180
control_period: 0.1
controller_execution: parallel
controller_worker_timeout_wall: 1.0
controller_worker_startup_timeout_wall: 30.0
publish_rate: 20.0
state_timeout_sim: 0.5
sensor_timeout_sim: 0.5
target_timeout_sim: 1.5
target_search_timeout_sim: 8.0
planner_failure_timeout_sim: 3.0
arrival_fleet_radius: 75.0  # four follower slots are nominally 43.75 m from leader
arrival_timeout_sim: 90.0
command_timeout_sim: 0.4
command_timeout_wall: 3.0
pose_timeout_wall: 3.0
fcu_timeout_sim: 2.5
fcu_timeout_wall: 60.0
target_mode: camera
altitude_kp: 1.0
vertical_speed_limit: 2.0
calibration_samples: 10
world_from_local_yaw: 0.0
frame_history_tolerance: 0.3
scan_height_tolerance: 1.0
marker_min_pixels: 4
params:
  ACCEL_TAU: 0.2
  CORRIDOR_MAX_FACES: 16
  SLOT_MIN_RATIO: 0.45
  SLOT_LOOKAHEAD_TIME: 2.0
  IPOPT_OPTIONS:
    ipopt.max_iter: 100
    ipopt.max_cpu_time: 0.06
    ipopt.print_level: 0
    ipopt.tol: 0.0001
    ipopt.acceptable_tol: 0.01
    ipopt.acceptable_iter: 10
    print_time: 0

# Pair with scenarios/big1000_5uav.yaml and /workspace/config/fleet_5uav.yaml.
# Algorithm scales live in the scenario; do not apply the small-map overrides.
flight_altitude: 30.0
obstacle_height: 70.0      # tall prisms also cover tilted 50 m lidar rays
target_height: 0.05
camera_width: 160
camera_height: 160
camera_rate: 8.0
camera_hfov: 1.389476552   # 2*atan(25/30): approximately 50 m ground footprint
lidar_rate: 10.0
lidar_samples: 180
control_period: 0.1
controller_execution: parallel
controller_worker_timeout_wall: 2.0
controller_worker_startup_timeout_wall: 60.0
publish_rate: 20.0
state_timeout_sim: 0.5
sensor_timeout_sim: 0.5
target_timeout_sim: 1.5
target_search_timeout_sim: 8.0
planner_failure_timeout_sim: 3.0
arrival_fleet_radius: 75.0 # accommodates four slots at 43.75 m from leader
arrival_timeout_sim: 120.0
flight_timeout_wall: 900.0  # allow a 30 m climb on a slower rendering machine
landing_timeout_wall: 900.0
command_timeout_sim: 0.4
command_timeout_wall: 6.0   # two worker phases of at most 2 s plus transport
pose_timeout_wall: 3.0
fcu_timeout_sim: 2.5
fcu_timeout_wall: 60.0
target_mode: camera
altitude_kp: 1.0
vertical_speed_limit: 2.0
calibration_samples: 10
world_from_local_yaw: 0.0
frame_history_tolerance: 0.3
scan_height_tolerance: 30.0 # covers tilt from both 5 m/s² axes at 50 m; discard ground hits
marker_min_pixels: 4
params:
  UAV_SAFE_DISTANCE: 2.0
  COLLISION_AVOID_DISTANCE: 3.0
  ACCEL_TAU: 0.2
  CORRIDOR_MAX_FACES: 16
  SLOT_MIN_RATIO: 0.45
  SLOT_LOOKAHEAD_TIME: 2.0
  IPOPT_OPTIONS:
    ipopt.max_iter: 100
    ipopt.max_cpu_time: 0.1
    ipopt.print_level: 0
    ipopt.tol: 0.0001
    ipopt.acceptable_tol: 0.01
    ipopt.acceptable_iter: 10
    print_time: 0

# Select with --preset scen1. All distances are metres; FCU speed/acceleration parameters use cm.
# Keep the five-worker solve/mapping cycle inside simulation-time command expiry.
simulation_real_time_factor: 0.2
flight_altitude: 30.0
obstacle_height: 40.0
target_height: 0.05
overhead_camera_offset: [-100, -100, 260]
camera_width: 320
camera_height: 320
camera_rate: 8.0
camera_hfov: 1.392432603581188
coverage_ray_diameter: 0.3
coverage_outline_diameter: 0.3
target_startup_ramp_sim: 3.0
lidar_rate: 10.0
lidar_samples: 360
lidar_noise_stddev: 0.016666666666666666
control_period: 0.1
diagnostic_capture_cycles: 128
controller_execution: parallel
controller_worker_timeout_wall: 2.0
controller_worker_startup_timeout_wall: 30.0
publish_rate: 20.0
state_timeout_sim: 0.5
sensor_timeout_sim: 0.5
target_timeout_sim: 1.5
target_search_timeout_sim: 8.0
planner_failure_timeout_sim: 3.0
arrival_fleet_radius: 65.0
arrival_timeout_sim: 30.0
command_timeout_sim: 0.4
command_timeout_wall: 3.0
pose_timeout_wall: 3.0
fcu_timeout_sim: 2.5
fcu_timeout_wall: 60.0
target_mode: camera
altitude_kp: 1.0
vertical_speed_limit: 2.0
calibration_samples: 10
world_from_local_yaw: 0.0
frame_history_tolerance: 0.3
marker_min_pixels: 4
params:
  ROBOT_RADIUS: 0.5
  UAV_SAFE_DISTANCE: 4.0
  COLLISION_AVOID_DISTANCE: 10.0
  # Bound distant SEARCH approaches and account for the SITL response after
  # configuring horizontal input shaping below.
  VMAX: 6.0
  UMAX: 3.0
  ACCEL_TAU: 0.3
  SPEED_RECOVERY: true
  LOCAL_SEARCH: jps
  CONTINGENCY: true
  BACKUP_HORIZON: 30
  W_backup: 0.1
  TERMINAL_STOP: false
  CORRIDOR_MAX_FACES: 16
  CORRIDOR_CACHE_FACES: [4, 5, 6, 7, 8, 9, 10, 11, 12]
  SLOT_MIN_RATIO: 0.3
  SLOT_EXPAND_SPEED: 2.0
  SLOT_LOOKAHEAD_TIME: 2.0
  IPOPT_OPTIONS:
    ipopt.max_iter: 500
    ipopt.max_cpu_time: 0.75
    ipopt.print_level: 0
    ipopt.tol: 0.0001
    ipopt.acceptable_tol: 0.01
    ipopt.acceptable_iter: 15
    print_time: 0
landing_timeout_sim: 120.0
sitl_params:
  WPNAV_SPEED: 1200
  WPNAV_ACCEL: 500
  PSC_ACC_XY: 500
  # m/s³ (unlike the cm-based speed/acceleration parameters): the default 5
  # delays acceleration reversal far beyond the MPC's first-order lag model.
  PSC_JERK_XY: 20
  WPNAV_SPEED_UP: 300
  WPNAV_ACCEL_Z: 200
  LAND_SPEED: 100

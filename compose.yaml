services:
  sim:
    image: ${SIM_IMAGE:-solo-simulation:gd0}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: simulation
      args:
        BUILD_JOBS: ${BUILD_JOBS:-4}
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    shm_size: 1gb
    environment:
      HOME: /tmp/solo-user-home
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      GZ_PARTITION: ${COMPOSE_PROJECT_NAME:-solo}
      SIM_PROFILE: ${SIM_PROFILE:-control}
      FLEET_CONFIG: ${FLEET_CONFIG:-/workspace/config/fleet.yaml}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-600}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-}
      RUN_ID: ${RUN_ID:-}
      SIM_RESUME: ${SIM_RESUME:-false}
    volumes:
      - .:/workspace
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python3", "/workspace/scripts/healthcheck.py"]
      interval: 10s
      timeout: 3s
      start_period: 600s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "3"
  companion:
    profiles: [hardware]
    image: ${COMPANION_IMAGE:-solo-companion:gd0}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: companion
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: host
    environment:
      HOME: /tmp/solo-user-home
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${HARDWARE_DISCOVERY_RANGE:-LOCALHOST}
      HARDWARE_CONFIG: /workspace/config/hardware.yaml
      RUNS_ROOT: /workspace/runs/hardware
    volumes:
      - .:/workspace
    stop_grace_period: 30s
